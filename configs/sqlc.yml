version: '2'
sql:
    - engine: sqlite
      schema: ../internal/database/schema.sql
      queries:
          - ../internal/database/user.sql
      gen:
          go:
              package: database
              out: ../internal/database
              emit_json_tags: true
              emit_interface: true
              emit_result_struct_pointers: true
              emit_pointers_for_null_types: true
              initialisms: [id, totp, url]
              json_tags_case_style: camel
              output_batch_file_name: batch.sql.go
              output_db_file_name: db.sql.go
              output_querier_file_name: querier.sql.go
              output_models_file_name: models.sql.go
              query_parameter_limit: 0
              overrides:
                  - column: users.picture_url
                    go_type:
                        type: string
                        pointer: true
                  - column: users.totp_secret
                    go_type:
                        type: string
                        pointer: true
