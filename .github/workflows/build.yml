# build.yml

name: build

on:
    push:
        branches: ['main', 'develop']
    pull_request:
        branches: ['main']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: '1.26'

            - name: Set up Node.js
              uses: pnpm/action-setup@v4

            - name: Build
              run: go tool task build

            - name: Test
              run: go tool task test
